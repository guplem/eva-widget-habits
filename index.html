<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Habits</title>
    <!-- Eva answers this path with her colours. The widget works without it too. -->
    <link rel="stylesheet" href="eva/theme.css" />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <main class="widget" data-size="medium">
      <header class="widget-header">
        <h1 class="widget-title">Habits</h1>
        <p class="widget-summary" data-role="summary"></p>
      </header>
      <!-- The small card: one chip for each habit, as many as fit, then "+N more". -->
      <ul class="chip-list" data-role="chips"></ul>
      <div class="widget-body">
        <section class="overview" data-role="overview" aria-label="Habits">
          <!-- Large sizes and full screen: the sort order and the archived habits. -->
          <div class="toolbar" data-role="toolbar" hidden>
            <label class="toolbar-field">
              <span>Sort</span>
              <select data-role="sort"></select>
            </label>
            <label class="toolbar-field toolbar-check">
              <input type="checkbox" data-role="show-archived" />
              <span>Archived</span>
            </label>
          </div>
          <div class="day-header" data-role="day-header" aria-hidden="true" hidden></div>
          <ul class="habit-list" data-role="habits"></ul>
        </section>
        <section class="habit-detail" data-role="detail" hidden></section>
      </div>
      <p class="widget-note" data-role="note" hidden></p>
      <!-- The floating menu of a habit or of a day. main.js places it inside the frame. -->
      <div class="menu" data-role="menu" role="menu" hidden></div>
      <dialog class="value-dialog" data-role="value-dialog">
        <!-- No form: Eva's sandbox blocks a form submit. main.js closes the dialog with each button. -->
        <div class="value-form">
          <label class="value-label">
            <span class="value-title" data-role="value-title"></span>
            <span class="value-row">
              <input name="value" type="number" min="0" step="any" inputmode="decimal" />
              <span class="value-unit" data-role="value-unit"></span>
            </span>
          </label>
          <div class="value-actions">
            <button type="button" class="button-plain" data-close="cancel">Cancel</button>
            <button type="button" class="button-plain" data-close="remove" data-role="value-remove">Remove</button>
            <button type="button" class="button-main" data-close="save">Save</button>
          </div>
        </div>
      </dialog>
    </main>
  </body>
</html>
